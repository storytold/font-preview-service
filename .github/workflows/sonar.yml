name: SonarCloud Scan

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: sonarcloud-${{ github.ref }}
  # A push to main publishes the analysis: never cancel one mid-scan. A newer push still
  # replaces a queued one, so the latest commit is scanned and analyses arrive in order.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  sonarcloud:
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    uses: storytold/craft-common-actions/.github/workflows/sonarcloud.yml@main
    with:
      # One coverage job: the crate's single test would leave shards 2-4 with nothing to run.
      shards: 1
    secrets: inherit
