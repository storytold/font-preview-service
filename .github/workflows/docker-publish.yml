name: Docker publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCR_REPOSITORY: registry.digitalocean.com/artcraft/font-preview-service
  GHCR_REPOSITORY: ghcr.io/storytold/font-preview-service

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-26.04
          - platform: linux/arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch font sources (pinned)
        # Pinned upstream commits. Fonts are not stored in this repo; the build context
        # is assembled here so the image carries the full set without committing 7 GB.
        env:
          GOOGLE_FONTS_SHA: e7db6ca603fd4862010383ff17ffd6cc4ffac1c0
          NOTO_FONTS_SHA: ffebf8c1ee449e544955a7e813c54f9b73848eac
          NOTO_CJK_SHA: f8d157532fbfaeda587e826d4cd5b21a49186f7c
        run: |
          set -euo pipefail
          rm -rf fonts-src && mkdir -p fonts-src
          # google/fonts: license-grouped top-level dirs (ofl, apache, ufl).
          git clone --filter=blob:none --no-checkout --sparse https://github.com/google/fonts.git fonts-src/google
          git -C fonts-src/google sparse-checkout set --no-cone /ofl/ /apache/ /ufl/
          git -C fonts-src/google checkout --detach "$GOOGLE_FONTS_SHA"
          # Noto (main repo): only the unhinted fonts and the licence.
          git clone --filter=blob:none --no-checkout --sparse https://github.com/notofonts/noto-fonts.git fonts-src/noto
          git -C fonts-src/noto sparse-checkout set --no-cone /unhinted/ /LICENSE
          git -C fonts-src/noto checkout --detach "$NOTO_FONTS_SHA"
          # Noto CJK (separate repo, large OTFs).
          git clone --filter=blob:none --no-checkout --sparse https://github.com/notofonts/noto-cjk.git fonts-src/noto-cjk
          git -C fonts-src/noto-cjk sparse-checkout set --no-cone /Sans/OTF/ /Sans/LICENSE
          git -C fonts-src/noto-cjk checkout --detach "$NOTO_CJK_SHA"
          rm -rf fonts-src/*/.git

      - name: Log in to Docker Hub (DHI pull)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to the DigitalOcean Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: registry.digitalocean.com
          username: ${{ secrets.DIGITALOCEAN_TOKEN }}
          password: ${{ secrets.DIGITALOCEAN_TOKEN }}

      - name: Log in to GHCR (mirror)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # Push each platform's image to both registries by digest; the merge
          # job joins the digests into one multi-arch manifest per registry.
          outputs: type=image,name=${{ env.DOCR_REPOSITORY }},name=${{ env.GHCR_REPOSITORY }},push-by-digest=true,name-canonical=true,push=true
          provenance: false

      - name: Export digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ strategy.job-index }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish multi-arch manifest
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to the DigitalOcean Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: registry.digitalocean.com
          username: ${{ secrets.DIGITALOCEAN_TOKEN }}
          password: ${{ secrets.DIGITALOCEAN_TOKEN }}

      - name: Log in to GHCR (mirror)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.DOCR_REPOSITORY }}
            ${{ env.GHCR_REPOSITORY }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Create manifest lists and push
        working-directory: ${{ runner.temp }}/digests
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          # metadata-action emits "<repo>:<tag>" for every image, so each
          # registry only receives the tags that belong to it.
          for repo in "$DOCR_REPOSITORY" "$GHCR_REPOSITORY"; do
            tag_args=()
            while IFS= read -r tag; do
              case "$tag" in
                "$repo":*) tag_args+=(--tag "$tag") ;;
              esac
            done <<< "$TAGS"
            refs=()
            for digest in *; do
              refs+=("${repo}@sha256:${digest}")
            done
            docker buildx imagetools create "${tag_args[@]}" "${refs[@]}"
          done
