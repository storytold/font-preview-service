name: Docker publish

# Publishes the font preview renderer. The build itself lives in the shared
# reusable workflow, which handles the two registries, the multi-arch merge and
# the Docker Hardened Image login; this repo owns the triggers and the pinned
# font sources the image bakes in.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    uses: storytold/craft-common-actions/.github/workflows/docker-build.yml@main
    secrets: inherit
    with:
      images: |
        registry.digitalocean.com/artcraft/font-preview-service
        ghcr.io/storytold/font-preview-service
        docker.io/storytold/font-preview-service
      # The runtime image is a Docker Hardened Image, which needs a Docker Hub login.
      dhi-login: true
      timeout-minutes: 60
      # Fonts are not stored in this repo; the build context is assembled here so
      # the image carries the full set without committing 7 GB.
      pre-build-command: |
        set -euo pipefail
        GOOGLE_FONTS_SHA=e7db6ca603fd4862010383ff17ffd6cc4ffac1c0
        NOTO_FONTS_SHA=ffebf8c1ee449e544955a7e813c54f9b73848eac
        NOTO_CJK_SHA=f8d157532fbfaeda587e826d4cd5b21a49186f7c
        rm -rf fonts-src && mkdir -p fonts-src
        # google/fonts: license-grouped top-level dirs (ofl, apache, ufl).
        git clone --filter=blob:none --no-checkout --sparse https://github.com/google/fonts.git fonts-src/google
        git -C fonts-src/google sparse-checkout set --no-cone /ofl/ /apache/ /ufl/
        git -C fonts-src/google checkout --detach "$GOOGLE_FONTS_SHA"
        # Noto (main repo): only the unhinted fonts and the licence.
        git clone --filter=blob:none --no-checkout --sparse https://github.com/notofonts/noto-fonts.git fonts-src/noto
        git -C fonts-src/noto sparse-checkout set --no-cone /unhinted/ /LICENSE
        git -C fonts-src/noto checkout --detach "$NOTO_FONTS_SHA"
        # Noto CJK (separate repo, large OTFs).
        git clone --filter=blob:none --no-checkout --sparse https://github.com/notofonts/noto-cjk.git fonts-src/noto-cjk
        git -C fonts-src/noto-cjk sparse-checkout set --no-cone /Sans/OTF/ /Sans/LICENSE
        git -C fonts-src/noto-cjk checkout --detach "$NOTO_CJK_SHA"
        rm -rf fonts-src/*/.git
